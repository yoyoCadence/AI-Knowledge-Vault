name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  verify:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: vault
          POSTGRES_PASSWORD: vault
          POSTGRES_DB: vault_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U vault -d vault_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL_TEST: postgres://vault:vault@127.0.0.1:5432/vault_test
      S3_TEST_ENDPOINT: http://127.0.0.1:5055
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Start S3-compatible emulator (moto) for storage adapter tests
        run: |
          # Isolated venv: the runner's system Python ships conflicting boto3/pyOpenSSL packages.
          python3 -m venv "$RUNNER_TEMP/moto"
          "$RUNNER_TEMP/moto/bin/pip" install --quiet "moto[server]"
          nohup "$RUNNER_TEMP/moto/bin/moto_server" -H 127.0.0.1 -p 5055 > moto.log 2>&1 &
          for i in $(seq 1 30); do curl -sf http://127.0.0.1:5055/ >/dev/null && exit 0; sleep 1; done
          echo "moto server did not start"; cat moto.log; exit 1

      - name: Format check
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit + integration tests
        run: pnpm test

      - name: Build web
        run: pnpm build
        env:
          # Build-time placeholders only; runtime secrets are never needed to compile.
          APP_ORIGIN: http://localhost:3000
          PREVIEW_ORIGIN: http://127.0.0.1:3000

      - name: Build worker + CLI bundles
        run: pnpm build:node

  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: vault
          POSTGRES_PASSWORD: vault
          POSTGRES_DB: vault_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U vault -d vault_e2e"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL_E2E: postgres://vault:vault@127.0.0.1:5432/vault_e2e
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Install Chromium for Playwright
        run: pnpm exec playwright install --with-deps chromium

      - name: Build
        run: pnpm build && pnpm build:node

      - name: E2E tests
        run: pnpm test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          retention-days: 7

  docker:
    name: Docker image builds
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
      - name: Build image (web + worker + migrate)
        run: docker build --tag ai-knowledge-vault:ci .
      - name: Worker bundle starts and exits on invalid config
        run: |
          set +e
          docker run --rm ai-knowledge-vault:ci node dist/worker.mjs > out.log 2>&1
          code=$?
          cat out.log
          test "$code" -ne 0 && grep -q "Invalid environment configuration" out.log
